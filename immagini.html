<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ricerca immagini</title>
  <!-- <link rel="shortcut icon" type="image/png" href="./assets/images/logos/favicon.png" /> -->
  <link rel="stylesheet" href="./assets/css/styles.min.css" />
</head>

<body>
  <div class="body-wrapper">
    <div class="container-fluid">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title fw-semibold mb-4">Ricerca immagini</h5>
          <div class="card">
            <div class="card-body">
              <div class="mb-3">
                <label for="name" class="form-label">Nome quadro</label>
                <input type="text" class="form-control" id="name" placeholder="Nome quadro">
              </div>
              <button type="button" class="btn btn-primary" onclick="submit()">Cerca</button>
              <div class="mt-3" id="result"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    function submit() {
      const data = {name: document.getElementById("name").value}
      const request = new URLSearchParams(data)
      fetch("https://webhook-hub-production.up.railway.app/immagini", {
          method: "POST",
          body: request
      })
      .then((response) => response.json())
      .then((response) => {
        console.log(response)
        if (response == "OK") {
          document.getElementById("result").innerHTML = "La richiesta è stata registrata con successo."
        } else if (response == "KO") {
          document.getElementById("result").innerHTML = "SERVER ERROR"
        } else {
          let text = "<ul>"
          for (let i in response) {
            if (i == 0) {
              continue
            }
            if (response[i].includes("http")) {
              text += `<li><a href="${response[i]}" target="_blank" rel="noreferrer">${response[i]}</a></li>`
            }
          }
          document.getElementById("result").innerHTML = text + "</ul>"
        }
      })
      .catch((error) => {
        console.log(error)
        document.getElementById("result").innerHTML = "ERROR"
      })
    }
  </script>
  <script src="./assets/libs/jquery/dist/jquery.min.js"></script>
  <script src="./assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/sidebarmenu.js"></script>
  <script src="./assets/js/app.min.js"></script>
  <script src="./assets/libs/simplebar/dist/simplebar.js"></script>
</body>

</html>
